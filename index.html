<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>나의 일본어 홈피 · 초급 1~15과</title>
<style>
  :root {
    --ink: #4b4b4b; --sub: #8c8c8c; --line: #f2c9d6; --dot: #f0b4c6; --orange: #ff8a00; --sky: #ff6f9f; --sky-l: #ffeef4;
    --pink: #ff7fa8; --ok: #2fae7a; --ng: #e8554e; --paper: #ffffff; --bg: #fbe6ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: Gulim, "New Gulim", "Malgun Gothic", sans-serif; font-size: 12px;
    background-color: var(--bg); background-image: radial-gradient(#f5c9d8 1px, transparent 1px); background-size: 8px 8px; }
  .jp { font-family: "Yu Gothic", "Meiryo", sans-serif; font-weight: 600; }
  #stage { position: absolute; left: 50%; top: 50%; width: 960px; height: 672px; transform-origin: center; }
  .hompy { position: absolute; inset: 0; background: #fff6f9; border: 1px solid #e79ab4; border-radius: 12px; box-shadow: 0 0 0 6px #f8d3df, 0 14px 40px rgba(60,90,120,0.25); }
  .top { position: absolute; left: 14px; right: 110px; top: 10px; height: 28px; display: flex; align-items: center; justify-content: space-between; }
  .top .title { font-size: 15px; font-weight: bold; color: #d2557f; letter-spacing: -0.3px; }
  .top .title span { color: var(--orange); }
  .counter { font-size: 11px; color: var(--sub); }
  .counter b { color: var(--orange); font-family: Verdana, sans-serif; }
  .counter i { font-style: normal; color: var(--sky); font-family: Verdana, sans-serif; font-weight: bold; }
  .box { position: absolute; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  .left { left: 12px; top: 44px; width: 200px; bottom: 12px; padding: 10px; }
  .main { left: 220px; top: 44px; width: 622px; bottom: 12px; overflow: hidden; }
  .dotline { border-top: 1px dashed var(--dot); margin: 8px 0; }
  .today { font-size: 11px; color: var(--sub); }
  .today b { color: var(--pink); }
  #miniCv { display: block; width: 178px; height: 178px; margin: 6px auto; image-rendering: pixelated; background: linear-gradient(#ffeef4, #fff); border: 1px solid var(--line); border-radius: 6px; }
  .pname { text-align: center; font-weight: bold; font-size: 13px; color: #d2557f; }
  .pname small { display: block; font-weight: normal; color: var(--sub); font-size: 11px; margin-top: 2px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 2px; font-size: 12px; }
  .stat b { color: var(--orange); font-family: Verdana, sans-serif; font-size: 12px; }
  .bar { height: 8px; background: #fdeef3; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin: 2px 0 6px; }
  .bar i { display: block; height: 100%; background: repeating-linear-gradient(45deg, #ff9dbc 0 4px, #ff7fa8 4px 8px); }
  .ichon { font-size: 11px; color: var(--sub); line-height: 1.7; }
  .ichon b { color: var(--ink); }
  .tabs { position: absolute; right: 12px; top: 44px; width: 92px; display: flex; flex-direction: column; gap: 3px; }
  .tab { background: #ff9dbc; color: #fff; border: 1px solid #f37aa2; border-left: 0; border-radius: 0 8px 8px 0; padding: 9px 10px; font-size: 12px; font-weight: bold; text-align: left; cursor: pointer; font-family: inherit; }
  .tab.on { background: #fff; color: #d2557f; border-color: var(--line); }
  .tab small { display: block; font-weight: normal; font-size: 10px; opacity: 0.85; }
  .bgm { position: absolute; right: 12px; bottom: 12px; width: 92px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; font-size: 10px; color: var(--sub); line-height: 1.4; }
  .bgm b { color: var(--sky); display: block; min-height: 26px; }
  .bgm .ctl { display: flex; gap: 3px; margin-top: 4px; }
  .bgm button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 3px; font-size: 10px; padding: 2px 0; cursor: pointer; color: var(--ink); font-family: inherit; }
  .bgm button.on { background: var(--sky); color: #fff; border-color: var(--sky); }
  /* 홈 · 마을 */
  #cv { position: absolute; left: 0; top: 0; width: 620px; height: 560px; image-rendering: pixelated; border-radius: 8px 8px 0 0; }
  .now { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; border-top: 1px dashed var(--dot); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 13px; }
  .now .tag { background: var(--orange); color: #fff; font-weight: bold; border-radius: 3px; padding: 2px 6px; font-size: 11px; }
  .now small { color: var(--sub); }
  .now .help { margin-left: auto; font-size: 11px; color: var(--sub); }
  .view { position: absolute; inset: 0; padding: 16px 18px; overflow: auto; display: none; }
  .view.on { display: block; }
  .view h3 { font-size: 14px; color: #d2557f; border-bottom: 1px dashed var(--dot); padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .view h3 small { color: var(--sub); font-weight: normal; }
  /* 대화창 */
  .dlg { position: absolute; left: 12px; right: 12px; bottom: 62px; background: #fff; border: 1px solid #e79ab4; border-radius: 6px; box-shadow: 0 4px 0 rgba(210,85,127,0.15); display: none; }
  .dlg.on { display: block; }
  .dhead { background: linear-gradient(#fff0f5, #ffd9e6); border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; padding: 5px 10px; display: flex; justify-content: space-between; font-weight: bold; color: #d2557f; font-size: 12px; }
  .dhead .u { color: var(--orange); }
  .dbody { padding: 12px 16px 12px; }
  .line-jp { font-size: 22px; line-height: 1.4; color: #333; }
  .line-rd { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .line-ko { font-size: 12px; color: var(--sky); font-weight: bold; margin-top: 3px; min-height: 16px; }
  .tools { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .tbtn { border: 1px solid var(--line); background: #f6f9fb; border-radius: 3px; padding: 3px 9px; font-size: 11px; color: var(--ink); cursor: pointer; font-family: inherit; }
  .next { margin-left: auto; color: var(--orange); font-size: 11px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .ask { font-size: 12px; font-weight: bold; color: #d2557f; margin-bottom: 8px; }
  .ask .big { font-size: 20px; color: #333; }
  .ask .q { color: var(--orange); margin-right: 4px; }
  .opts { display: grid; gap: 5px; }
  .opt { text-align: left; border: 1px dashed var(--dot); background: #fffafc; border-radius: 4px; padding: 7px 12px; cursor: pointer; font-family: inherit; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .opt:hover { border-style: solid; border-color: var(--orange); background: #fff8ef; }
  .opt .o-jp { font-size: 17px; color: #333; }
  .opt .o-rd { font-size: 11px; color: var(--sub); }
  .opt.wrong { border: 1px solid var(--ng); background: #fff0ef; }
  .opt.right { border: 1px solid var(--ok); background: #eefaf4; }
  .fb { margin-top: 7px; font-size: 12px; font-weight: bold; min-height: 16px; }
  .fb.ng { color: var(--ng); } .fb.ok { color: var(--ok); }
  .shopgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .icard { border: 1px dashed var(--dot); background: #fffafc; border-radius: 4px; padding: 7px 9px; cursor: pointer; text-align: left; color: var(--ink); font-family: inherit; }
  .icard:hover { border-style: solid; border-color: var(--orange); }
  .icard .i-jp { font-size: 15px; color: #333; }
  .icard .i-ko { font-size: 11px; color: var(--sub); }
  .icard .i-p { margin-top: 3px; display: flex; justify-content: space-between; align-items: baseline; }
  .icard .i-p b { color: var(--orange); font-family: Verdana, sans-serif; font-size: 12px; }
  .icard .i-p span { font-size: 10px; color: var(--sub); }
  .icard.owned { opacity: 0.4; cursor: default; }
  .shopfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; }
  /* 다이어리 · 사진첩 · 방명록 */
  .diary li { list-style: none; display: flex; gap: 10px; padding: 7px 4px; border-bottom: 1px dotted var(--dot); font-size: 12px; align-items: center; }
  .diary li .d { width: 74px; color: var(--sub); font-family: Verdana, sans-serif; font-size: 10px; }
  .diary li .u { width: 40px; color: var(--sky); font-weight: bold; }
  .diary li .s { margin-left: auto; font-size: 11px; }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .scard { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; background: #fff; box-shadow: 2px 2px 0 #fbe1ea; }
  .scard .s-jp { font-size: 15px; color: #333; }
  .scard .s-rd { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .scard .s-ko { font-size: 12px; color: var(--sky); font-weight: bold; margin-top: 2px; }
  .scard .s-where { font-size: 10px; color: #aab; margin-top: 3px; }
  .scard.locked { border-style: dashed; color: #b8c4cf; display: flex; align-items: center; justify-content: center; min-height: 64px; box-shadow: none; }
  .guest { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: #fff; }
  .guest .gh { background: #fff3f7; border-bottom: 1px dotted var(--dot); padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; color: var(--sub); }
  .guest .gh b { color: #d2557f; }
  .guest .gb { padding: 8px 10px; font-size: 12px; line-height: 1.6; }
  .guest .gb .x { color: var(--ng); text-decoration: line-through; }
  .guest .gb .o { color: var(--ok); font-weight: bold; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; line-height: 1.8; }
  #roomCv { display: block; width: 584px; height: 420px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; margin: 0 auto; }
  .note { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
  .wear { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  #styleCv { width: 220px; height: 260px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#ffeef4, #fff); }
  .wlist { display: grid; gap: 5px; align-content: start; }
  .wbtn { border: 1px dashed var(--dot); background: #fffafc; border-radius: 4px; padding: 7px 10px; color: var(--ink); font-family: inherit; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .wbtn.on { border: 1px solid var(--ok); background: #eefaf4; }
  .wbtn.lock { opacity: 0.4; cursor: default; }
  .wbtn small { color: var(--sub); font-size: 11px; }
  .toast { position: absolute; top: 12px; left: 50%; transform: translate(-50%, -10px); background: #fffbe6; color: #b56a00; border: 1px solid #f2c46b; font-weight: bold; font-size: 12px; padding: 7px 16px; border-radius: 4px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; box-shadow: 2px 2px 0 #f6e2b5; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .end { position: absolute; inset: 0; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; }
  .end.on { display: flex; }
  .end .card { width: 420px; background: #fff; border: 1px solid #e79ab4; border-radius: 8px; box-shadow: 0 4px 0 rgba(210,85,127,0.15); text-align: center; padding: 22px; }
  .end .big { font-size: 34px; color: var(--orange); font-family: Verdana, sans-serif; font-weight: bold; margin: 6px 0; }
  .end .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
  .end .row div { border: 1px dashed var(--dot); border-radius: 4px; padding: 8px; }
  .end .row b { display: block; font-size: 18px; font-family: Verdana, sans-serif; color: #d2557f; }
  .bigbtn { border: 1px solid var(--orange); background: #fff8ef; color: var(--orange); font-weight: bold; font-size: 12px; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; }
  .range { position: absolute; inset: 0; background: rgba(255,246,249,0.94); display: none; align-items: center; justify-content: center; z-index: 5; }
  .range.on { display: flex; }
  .range .card { width: 440px; background: #fff; border: 1px solid #e79ab4; border-radius: 8px; box-shadow: 0 4px 0 rgba(210,85,127,0.15); padding: 22px 26px; text-align: center; }
  .range h4 { font-size: 16px; color: #d2557f; margin-bottom: 4px; }
  .range p { color: var(--sub); font-size: 12px; line-height: 1.6; }
  .range .sel { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 16px 0 6px; font-size: 13px; }
  .range select { font-family: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fffafc; color: var(--ink); }
  .range .cnt { color: var(--orange); font-weight: bold; font-size: 12px; margin-bottom: 14px; }
  .range .book { font-size: 12px; color: var(--ink); background: var(--sky-l); border: 1px dashed var(--dot); border-radius: 4px; padding: 6px; margin-top: 10px; }
  .pad { position: absolute; left: 10px; bottom: 64px; width: 120px; height: 120px; display: none; }
  .pad button, .abtn { position: absolute; width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.9); font-size: 15px; color: var(--ink); }
  .pad .u { left: 40px; top: 0; } .pad .d { left: 40px; bottom: 0; } .pad .lf { left: 0; top: 40px; } .pad .rt { right: 0; top: 40px; }
  .abtn { right: 14px; bottom: 74px; width: 56px; height: 56px; border-radius: 50%; border-color: var(--orange); color: var(--orange); display: none; font-weight: bold; }
  @media (pointer: coarse) { .pad, .abtn { display: block; } }
</style>
</head>
<body>
<div id="stage">
  <div class="hompy"></div>
  <div class="top"><div class="title">♡ 나의 일본어 홈피 <span id="topRange">· 초급 1~15과</span></div><div class="counter">TODAY <b id="cToday">0</b> | TOTAL <i id="cTotal">0</i></div></div>
  <div class="box left">
    <div class="today">TODAY IS… <b>열공 중 ♪</b></div>
    <canvas id="miniCv" width="60" height="60"></canvas>
    <div class="pname">나 <small>초급 일본어 수강생</small></div>
    <div class="dotline"></div>
    <div class="stat"><span>진도</span><b id="sProg"></b></div>
    <div class="bar"><i id="sBar"></i></div>
    <div class="stat"><span>모은 문장</span><b id="sPhr"></b></div>
    <div class="stat"><span>지갑</span><b id="sYen"></b></div>
    <div class="stat"><span>미니룸 소품</span><b id="sRoom"></b></div>
    <div class="dotline"></div>
    <div class="ichon" id="ichon"></div>
  </div>
  <div class="box main" id="main">
    <canvas id="cv" width="620" height="560"></canvas>
    <div class="now" id="now"></div>
    <div class="dlg" id="dlg"><div class="dhead"><span id="dName"></span><span class="u" id="dUnit"></span></div><div class="dbody" id="dBody"></div></div>
    <div class="view" id="v-diary"></div>
    <div class="view" id="v-photo"></div>
    <div class="view" id="v-room"><h3><span>미니룸</span><small id="roomTitle"></small></h3><canvas id="roomCv" width="200" height="141"></canvas><div class="note" id="roomNote"></div></div>
    <div class="view" id="v-mini"><h3><span>미니미 꾸미기</span><small>ふくや에서 산 옷을 입혀요</small></h3><div class="wear"><canvas id="styleCv" width="44" height="52"></canvas><div class="wlist" id="wlist"></div></div></div>
    <div class="view" id="v-guest"></div>
    <div class="toast" id="toast"></div>
    <div class="end" id="end"></div>
    <div class="range" id="range"><div class="card"><h4>♡ 내 시험 범위로 마을 만들기</h4><p>이번 시험에 나오는 과만 골라 주세요.<br>고른 과만 마을 미션과 연습 문제로 열려요.</p>
      <div class="book">교재 · 초급 상권 (1~15과)</div>
      <div class="sel"><select id="rFrom"></select> 부터 <select id="rTo"></select> 까지</div>
      <div class="cnt" id="rCnt"></div><button class="bigbtn" id="rGo">이 범위로 시작하기</button></div></div>
    <div class="pad" id="pad"><button class="u" data-d="up">▲</button><button class="d" data-d="down">▼</button><button class="lf" data-d="left">◀</button><button class="rt" data-d="right">▶</button></div>
    <button class="abtn" id="abtn">말</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="home">홈<small>마을 산책</small></button>
    <button class="tab" data-v="diary">다이어리<small>과별 미션</small></button>
    <button class="tab" data-v="photo">사진첩<small>문장 도감</small></button>
    <button class="tab" data-v="room">미니룸<small>내 방</small></button>
    <button class="tab" data-v="mini">미니미<small>꾸미기</small></button>
    <button class="tab" data-v="guest">방명록<small>오답 노트</small></button>
    <button class="tab" id="tabRange">시험 범위<small>바꾸기</small></button>
  </div>
  <div class="bgm" id="bgm">♪ BGM<b id="bgmName"></b><div class="ctl"><button id="bgmPrev">◀</button><button id="bgmPlay">▶</button><button id="bgmNext">▶▶</button></div></div>
</div>
<script>
// 나의 일본어 홈피 · 초급 교재 1~15과 학습 항목을 마을 미션과 연습 문제로
// 대사 · 문제는 과별 문법 항목에 맞춰 새로 쓴 문장 (교재 본문을 옮기지 않음)
const T = 24, COLS = 28, ROWS = 18, WW = COLS * T, WH = ROWS * T, SC = 2, VW = 620 / SC, VH = 560 / SC;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = VW; buf.height = VH; const g = buf.getContext('2d');
const $ = id => document.getElementById(id);
let trL = s => s;
function fit() { const s = Math.min(window.innerWidth / 984, window.innerHeight / 696); $('stage').style.transform = `translate(-50%, -50%) scale(${s})`; }
window.addEventListener('resize', fit); fit();
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// ───── 마을 지도 (타일 단위) ─────
const PATHS = [[0, 4, COLS, 1], [0, 13, COLS, 1], [9, 4, 2, 10], [19, 4, 2, 10]];
const BUILDINGS = [
  { x: 1, y: 1, w: 3, h: 3, wall: '#fff3e0', roof: '#ff9f6b', sign: 'いえ' },
  { x: 5, y: 1, w: 4, h: 3, wall: '#fff0f4', roof: '#ff8fb0', sign: 'カフェ', deco: 'awning' },
  { x: 11, y: 1, w: 4, h: 3, wall: '#f4fbff', roof: '#6cc0ee', sign: 'コンビニ', deco: 'stripe' },
  { x: 16, y: 1, w: 3, h: 3, wall: '#f7f0ff', roof: '#b493e8', sign: 'ふくや' },
  { x: 22, y: 1, w: 5, h: 3, wall: '#f5f8ec', roof: '#8cc46a', sign: 'としょかん' },
  { x: 1, y: 10, w: 4, h: 3, wall: '#fff1e6', roof: '#ee6b5c', sign: 'ラーメン', deco: 'noren' },
  { x: 5.6, y: 10, w: 3.2, h: 3, wall: '#effaf5', roof: '#5cc8a0', sign: 'ざっかや' },
  { x: 11, y: 10, w: 6, h: 3, wall: '#eef3ff', roof: '#7d95d8', sign: 'えき', deco: 'clock' },
  { x: 22, y: 10, w: 4, h: 3, wall: '#fff8e6', roof: '#f2b84b', sign: 'アパート', deco: 'boxes' },
];
const TREES = [];
for (let x = 0.4; x < COLS; x += 1.55) TREES.push([x, 0.35]);
for (let x = 0.3; x < COLS; x += 1.8) TREES.push([x + 0.3, 17.3]);
[[20.6, 1.4], [27.4, 2.6], [0.4, 7.6], [8.2, 6.0], [11.3, 9.0], [18.2, 9.2], [22.4, 6.4], [25.6, 8.6], [27.4, 6.0], [27.3, 11.4],
 [3.0, 15.6], [8.0, 15.4], [14.5, 15.6], [23.5, 15.5], [18.8, 15.9]].forEach(t => TREES.push(t));

  if (look.hs === 'bob') { for (let r = 4; r <= 8; r++) { set(r, 1, 'h'); set(r, 10, 'h'); } set(8, 2, 'h'); set(8, 9, 'h'); }

  if (dir === 'up') for (let r = 3; r <= 7; r++) for (let c = 2; c <= 9; c++) set(r, c, 'h');
  const a = look.accs || [];
  if (a.includes('glasses') && dir !== 'up') { [2, 4, 7, 9].forEach(c => set(5, c, 'g')); }
  if (a.includes('apron')) for (let r = 10; r <= 12; r++) for (let c = 3; c <= 8; c++) set(r, c, 'a');
  if (a.includes('scarf')) for (let c = 2; c <= 9; c++) set(9, c, 'q');
  if (a.includes('muffler')) { for (let c = 2; c <= 9; c++) set(9, c, 'm'); set(10, 8, 'm'); set(11, 8, 'm'); }
  if (a.includes('beanie')) { for (let r = 0; r <= 1; r++) for (let c = 0; c < 12; c++) if (rows[r][c] === 'h') set(r, c, 'k'); for (let c = 1; c <= 10; c++) set(2, c, 'K'); }
  if (a.includes('cap')) { for (let r = 0; r <= 2; r++) for (let c = 0; c < 12; c++) if (rows[r][c] === 'h') set(r, c, 'n'); for (let c = 1; c <= 10; c++) set(3, c, 'n'); set(1, 5, 'y'); set(1, 6, 'y'); }

  if (frame) { rows[13] = '...pp...pp..'.split(''); rows[14] = '..pp....pp..'.split(''); rows[15] = '..ff.....ff.'.split(''); }
  return rows;
}

function freq(n) { const m = n.match(/^([A-G])(#?)(\d)$/); const idx = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0); return 440 * Math.pow(2, (idx + (+m[3] - 4) * 12 - 9) / 12); }

}

    if (i % 4 === 0) tone(bgm.next, freq(bass[(i / 4) % bass.length]), sd * 3.6, 'triangle', 0.07);

}

    '잇쇼니 콘사-토니 이키마셍카?': 'issho ni konsāto ni ikimasen ka?', '같이 콘서트에 가지 않을래요?': 'Shall we go to the concert together?', '이- 데스네. 이키마쇼-!': 'ii desu ne. ikimashō!', '좋아요. 가요!': "Sounds good. Let's go!",
    '카이케-시니 나리타이 데스.': 'kaikeishi ni naritai desu.', '회계사가 되고 싶어요.': 'I want to become an accountant.', '니혼니 이키타이 데스.': 'Nihon ni ikitai desu.', '일본에 가고 싶어요.': 'I want to go to Japan.',
    '춋토 테츠닷테 쿠다사이.': 'chotto tetsudatte kudasai.', '좀 도와주세요.': 'Please help me a little.', '코노 하코오 못테 쿠다사이.': 'kono hako o motte kudasai.', '이 상자를 들어 주세요.': 'Please carry this box.',
    '요-코소! 칸반오 욘데 미테.': 'yōkoso! kanban o yonde mite.', '어서 와요! 간판을 읽어 봐요.': 'Welcome! Try reading the signs.', '하지메마시테. 켄타 데스.': 'hajimemashite. Kenta desu.', '처음 뵙겠습니다. 켄타입니다.': "Nice to meet you. I'm Kenta.",
  };
  const WHERE = { '아파트 · 아래 길 오른쪽': 'Apartment · lower street, right', '라멘집 · 아래 길': 'Ramen shop · lower street', '역 · 아래 길': 'Station · lower street', '옷가게 ふくや': 'Clothes shop ふくや',
    '도서관 としょかん': 'Library としょかん', '집 앞': 'In front of home', '공원': 'Park', '카페': 'Café', '도서관': 'Library', '역': 'Station' };
  Object.entries(WHERE).forEach(([k, v]) => { SUB['📍 ' + k] = '📍 ' + v; SUB['· ' + k] = '· ' + v; });
  ['다이스케', '아오이', '켄타', '미오', '유이', '카이', '사토', '하나', '렌'].forEach(n => { EXACT[n] = n === '다이스케' ? 'Daisuke' : { 아오이: 'Aoi', 켄타: 'Kenta', 미오: 'Mio', 유이: 'Yui', 카이: 'Kai', 사토: 'Sato', 하나: 'Hana', 렌: 'Ren' }[n]; });
  const NAMES = { 다이스케: 'Daisuke', 아오이: 'Aoi', 켄타: 'Kenta', 미오: 'Mio', 유이: 'Yui', 카이: 'Kai', 사토: 'Sato', 하나: 'Hana', 렌: 'Ren' };
  const keys = Object.keys(SUB).sort((a, b) => b.length - a.length);
  const tr = s => {
    const k = s.trim(); if (k in EXACT) return s.replace(k, EXACT[k]);
    let o = s; keys.forEach(x => { if (o.includes(x)) o = o.split(x).join(SUB[x]); });
    o = o.replace(/(\d+) \/ (\d+)과/g, '$1 / $2 units').replace(/미션 (\d+)개/g, '$1 quests').replace(/문제 (\d+)개/g, '$1 questions').replace(/소품 (\d+) \/ (\d+)/g, 'items $1 / $2')
      .replace(/(\d+)·(\d+)과/g, 'Unit $1–$2').replace(/(\d+)과/g, 'Unit $1');
    Object.entries(NAMES).forEach(([a, b]) => { o = o.split(a).join(b); });
    return o;
  };
  trL = tr;
  let busy = false;
  const walk = root => { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) { const v = tr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; } };
  const stage = document.getElementById('stage');
  new MutationObserver(() => { if (busy) return; busy = true; walk(stage); busy = false; }).observe(stage, { subtree: true, childList: true, characterData: true });
  walk(stage); document.title = 'My Nihongo Hompy · Units 1–15';
}
requestAnimationFrame(frame);
</script>
